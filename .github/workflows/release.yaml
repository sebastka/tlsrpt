---
name: Release tlsrpt

on:
  workflow_dispatch:
  push: {branches: [master]}
  pull_request:

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  check:
    name: Check (tsc + eslint + prettier + tests) & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.ref }}
      cancel-in-progress: true
    # The store integration tests run against a real MariaDB.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-root
      TEST_DB_NAME: tlsrpt_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      # Validate the production build on every trigger (PRs included).
      - name: Build
        run: npm run build

  release:
    name: Build & publish signed archive
    needs: [check]
    if: github.event_name != 'pull_request'   # never publish from a PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # cosign keyless signing of the archive (OIDC)
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The bundle is the /app layout the deploy expects: the built UI in dist/web, the
      # TypeScript server (run directly by Node's type stripping) and its production
      # node_modules (pure JS, so an amd64 build runs on arm64 too). `scratch` has no Node,
      # so this is a filesystem bundle to be mounted into a node:26-alpine container that
      # runs `node /app/src/server/index.ts` (see the Dockerfile written in the docker job).
      - name: Assemble the tlsrpt bundle
        run: scripts/bundle.sh /tmp/stage/tlsrpt

      - name: Create release archive
        run: |
          tar -cJf /tmp/tlsrpt.tar.xz --owner=0 --group=0 -C /tmp/stage tlsrpt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Checksum and sign the archive
        run: |
          # SHA-256 (relative name so `sha256sum -c` works after download)
          ( cd /tmp && sha256sum tlsrpt.tar.xz > tlsrpt.tar.xz.sha256 )
          # Keyless signature via the job's GitHub OIDC identity
          # (bundle = signature + certificate + Rekor transparency-log entry).
          cosign sign-blob --yes /tmp/tlsrpt.tar.xz --bundle /tmp/tlsrpt.tar.xz.cosign.bundle

      # Tag = build date + short commit SHA, e.g. 2026.09.25-a3e232b (always unique).
      - name: Compute release tag
        id: tag
        run: echo "tag=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Compute image ref (for the release notes)
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: tlsrpt ${{ steps.tag.outputs.tag }}
          body: |
            Container image: `${{ steps.img.outputs.ref }}`

            Verify the archive (keyless, GitHub OIDC):

            ```
            cosign verify-blob tlsrpt.tar.xz \
              --bundle tlsrpt.tar.xz.cosign.bundle \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            sha256sum -c tlsrpt.tar.xz.sha256
            ```
          files: |
            /tmp/tlsrpt.tar.xz
            /tmp/tlsrpt.tar.xz.sha256
            /tmp/tlsrpt.tar.xz.cosign.bundle
          fail_on_unmatched_files: true

      - name: Upload archive for the image job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tlsrpt-archive
          path: /tmp/tlsrpt.tar.xz
          retention-days: 1
          if-no-files-found: error

  docker:
    name: Build & push scratch image
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (OIDC)
    steps:
      - name: Download archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tlsrpt-archive

      - name: Extract archive into the build context
        run: |
          mkdir -p context
          tar -xJf tlsrpt.tar.xz -C context

      # scratch = a data-only image: no Node, so it can't run itself. It carries the
      # bundle at /app, to be mounted into a node:26-alpine container that runs
      # `node /app/src/server/index.ts`.
      - name: Write Dockerfile
        run: printf -- 'FROM scratch\nCOPY tlsrpt /app\n' > context/Dockerfile

      - name: Set up Buildx  # docker-container driver enables provenance & SBOM attestations
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tag for traceability, plus a moving `latest` for the deploy to follow.
      - name: Compute image refs
        id: img
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "immutable=${repo}:${{ needs.release.outputs.tag }}"
            echo "latest=${repo}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: context
          push: true
          # The bundle is architecture independent and the Dockerfile has no RUN step, so
          # both platforms build natively without emulation.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.immutable }}
            ${{ steps.img.outputs.latest }}
          provenance: mode=max   # full SLSA build provenance attestation
          sbom: true             # generate + attach an SBOM attestation

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Keyless signing via the job's GitHub OIDC identity; signs by digest (tags are mutable).
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
